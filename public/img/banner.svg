<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Flux banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2c3e"/>
      <stop offset="0.45" stop-color="#2f4154"/>
      <stop offset="1" stop-color="#182433"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.22" cy="0.24" r="0.62">
      <stop offset="0" stop-color="#30a9de" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#30a9de" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#30a9de" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.82" cy="0.78" r="0.55">
      <stop offset="0" stop-color="#7b61ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.62" cy="0.12" r="0.4">
      <stop offset="0" stop-color="#26c6da" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#26c6da" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30a9de" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#30a9de" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#30a9de" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>
  <rect width="1600" height="900" fill="url(#glowC)"/>

  <!-- 流体曲线：三条正弦波，越靠下越淡 -->
  <g fill="none" stroke="url(#wave)" stroke-width="2">
    <path d="M-100 560 C 220 470, 420 660, 760 560 S 1320 430, 1700 520"/>
    <path d="M-100 640 C 260 560, 480 740, 820 640 S 1360 520, 1700 600" stroke-opacity="0.6"/>
    <path d="M-100 720 C 300 650, 520 820, 860 720 S 1400 610, 1700 690" stroke-opacity="0.35"/>
  </g>

  <!-- 漂浮的圆点 -->
  <g fill="#ffffff" fill-opacity="0.5">
    <circle cx="240" cy="300" r="2.5"/>
    <circle cx="420" cy="220" r="1.8"/>
    <circle cx="1180" cy="260" r="2.2"/>
    <circle cx="1340" cy="380" r="1.6"/>
    <circle cx="980" cy="180" r="1.4"/>
    <circle cx="700" cy="300" r="1.2"/>
  </g>
</svg>
