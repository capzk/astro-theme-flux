name: CI

# 为什么需要这个：`astro build` 不做类型检查。
# 配置里写错字段名、给某个对象塞了不存在的属性、改了类型却没同步调用方 ——
# 构建都会照常成功，只是那一行配置被静默忽略。这类问题在部署之后才由人眼发现，
# 而 `astro check` 一秒就能拦住。所以每次 push 都跑一遍。

on:
  push:
    branches: [main]
  pull_request:

# 同一个分支连着推两次，只保留最新那次的结果
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 类型检查 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json 的 engines 要求 >=22.23.4，用 24 留出余量
          node-version: 24
          cache: npm

      # CI 用 npm ci（严格按 lock 安装），本地用什么包管理器都不影响这里
      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run check

      - name: 构建
        run: npm run build
